<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carmella Holloway Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="folder-back">
      <div
        class="linkedin"
        data-tab="linkedin"
        role="button"
        tabindex="0"
        aria-label="LinkedIn"
      ></div>
      <div
        class="wEw"
        data-tab="wEw"
        role="button"
        tabindex="0"
        aria-label="Who Eats Whom"
      ></div>
      <div
        class="sas"
        data-tab="sas"
        role="button"
        tabindex="0"
        aria-label="SAS"
      ></div>
      <div
        class="skills"
        ata-tab="skills"
        role="button"
        tabindex="0"
        aria-label="Skills"
      ></div>
      <div
        class="about"
        data-tab="about"
        role="button"
        tabindex="0"
        aria-label="About"
      ></div>
      <div
        class="folder"
        role="button"
        tabindex="0"
        aria-label="Open portfolio folder"
      >
        <h1 class="name" id="name-title">Carmella Holloway</h1>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
